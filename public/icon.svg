<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0F0F1A"/>

  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
    <linearGradient id="nose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="flame1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD23F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="winbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background stars (small) -->
  <circle cx="80"  cy="90"  r="3" fill="#9B5DE5" opacity="0.8"/>
  <circle cx="430" cy="70"  r="2.5" fill="#4CC9F0" opacity="0.9"/>
  <circle cx="60"  cy="200" r="2" fill="#06D6A0" opacity="0.7"/>
  <circle cx="450" cy="180" r="3" fill="#FFD23F" opacity="0.8"/>
  <circle cx="100" cy="380" r="2.5" fill="#F72585" opacity="0.7"/>
  <circle cx="410" cy="360" r="2" fill="#9B5DE5" opacity="0.9"/>
  <circle cx="380" cy="440" r="3" fill="#4CC9F0" opacity="0.6"/>
  <circle cx="130" cy="440" r="2" fill="#FFD23F" opacity="0.8"/>
  <circle cx="460" cy="280" r="2" fill="#06D6A0" opacity="0.7"/>
  <circle cx="50"  cy="310" r="2.5" fill="#FF6B35" opacity="0.6"/>

  <!-- Star sparkles (4-pointed) -->
  <path d="M390 110 L393 120 L403 123 L393 126 L390 136 L387 126 L377 123 L387 120 Z" fill="#FFD23F" opacity="0.9"/>
  <path d="M118 145 L120 152 L127 154 L120 156 L118 163 L116 156 L109 154 L116 152 Z" fill="#4CC9F0" opacity="0.8"/>
  <path d="M430 390 L432 397 L439 399 L432 401 L430 408 L428 401 L421 399 L428 397 Z" fill="#9B5DE5" opacity="0.7"/>

  <!-- Flame outer glow -->
  <ellipse cx="256" cy="370" rx="52" ry="60" fill="#FFD23F" opacity="0.18" filter="url(#softglow)"/>

  <!-- Left fin -->
  <path d="M192 290 L148 370 L200 340 Z" fill="url(#fin)" opacity="0.95"/>
  <!-- Left fin detail -->
  <path d="M192 290 L170 340 L200 325 Z" fill="#FF6B35" opacity="0.4"/>

  <!-- Right fin -->
  <path d="M320 290 L364 370 L312 340 Z" fill="url(#fin)" opacity="0.95"/>
  <!-- Right fin detail -->
  <path d="M320 290 L342 340 L312 325 Z" fill="#FF6B35" opacity="0.4"/>

  <!-- Rocket body -->
  <ellipse cx="256" cy="230" rx="74" ry="118" fill="url(#body)"/>

  <!-- Body highlight (left edge shine) -->
  <ellipse cx="228" cy="218" rx="16" ry="64" fill="white" opacity="0.12"/>

  <!-- Nose cone -->
  <path d="M256 88 C220 120 185 170 185 224 L327 224 C327 170 292 120 256 88 Z" fill="url(#nose)"/>
  <!-- Nose cone shine -->
  <path d="M256 88 C240 115 225 155 228 205 C230 195 238 165 256 88 Z" fill="white" opacity="0.2"/>

  <!-- Window ring -->
  <circle cx="256" cy="215" r="42" fill="white" opacity="0.15"/>
  <!-- Window -->
  <circle cx="256" cy="215" r="36" fill="url(#winbg)"/>
  <!-- Window inner ring -->
  <circle cx="256" cy="215" r="36" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Window glass shine -->
  <circle cx="244" cy="203" r="10" fill="white" opacity="0.45"/>
  <circle cx="268" cy="226" r="5"  fill="white" opacity="0.18"/>
  <!-- Window star detail -->
  <path d="M256 207 L258 213 L265 213 L259 217 L261 224 L256 220 L251 224 L253 217 L247 213 L254 213 Z" fill="white" opacity="0.7"/>

  <!-- Body bottom cap -->
  <ellipse cx="256" cy="338" rx="74" ry="18" fill="#C14B1A" opacity="0.7"/>

  <!-- Nozzle -->
  <rect x="234" y="336" width="44" height="20" rx="8" fill="#1A1A2E"/>
  <rect x="238" y="340" width="36" height="14" rx="6" fill="#2A2A3E"/>

  <!-- Flame outer -->
  <ellipse cx="256" cy="376" rx="36" ry="52" fill="url(#flame1)" opacity="0.9" filter="url(#glow)"/>
  <!-- Flame mid -->
  <ellipse cx="256" cy="385" rx="22" ry="38" fill="#FF8C00" opacity="0.75"/>
  <!-- Flame inner -->
  <ellipse cx="256" cy="392" rx="13" ry="26" fill="url(#flame2)" opacity="0.9"/>
  <!-- Flame core -->
  <ellipse cx="256" cy="398" rx="6"  ry="14" fill="white" opacity="0.8"/>

  <!-- "UP" text subtle watermark -->
  <text x="256" y="480" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="38" fill="white" opacity="0.08" letter-spacing="4">UP</text>
</svg>
