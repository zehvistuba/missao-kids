<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c38"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B5DE5"/>
      <stop offset="50%" stop-color="#6A7CF8"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="rocketDark" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#7B3DBE"/>
      <stop offset="100%" stop-color="#3A9DC8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F72585" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9B5DE5" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle stars -->
  <circle cx="90"  cy="80"  r="2.5" fill="#9B5DE5" opacity="0.7"/>
  <circle cx="420" cy="60"  r="2"   fill="#4CC9F0" opacity="0.8"/>
  <circle cx="70"  cy="210" r="2"   fill="#06D6A0" opacity="0.6"/>
  <circle cx="445" cy="190" r="2.5" fill="#FFD23F" opacity="0.7"/>
  <circle cx="110" cy="420" r="2"   fill="#9B5DE5" opacity="0.6"/>
  <circle cx="400" cy="400" r="2.5" fill="#4CC9F0" opacity="0.7"/>

  <!-- Flame glow -->
  <ellipse cx="256" cy="395" rx="55" ry="55" fill="#FF6B35" opacity="0.15" filter="url(#softglow)"/>

  <!-- Outer flames -->
  <ellipse cx="226" cy="405" rx="16" ry="48" fill="url(#flameOuter)" transform="rotate(-14 226 385)" opacity="0.9"/>
  <ellipse cx="286" cy="405" rx="16" ry="48" fill="url(#flameOuter)" transform="rotate(14 286 385)" opacity="0.9"/>

  <!-- Main flame -->
  <ellipse cx="256" cy="398" rx="26" ry="60" fill="url(#flame)" filter="url(#glow)"/>

  <!-- Left wing -->
  <path d="M 213 285 L 155 370 Q 150 380 162 380 L 213 368 Z" fill="url(#rocketDark)"/>
  <!-- Left wing highlight -->
  <path d="M 213 300 L 175 365 L 213 356 Z" fill="url(#rocket)" opacity="0.4"/>

  <!-- Right wing -->
  <path d="M 299 285 L 357 370 Q 362 380 350 380 L 299 368 Z" fill="url(#rocketDark)"/>
  <!-- Right wing highlight -->
  <path d="M 299 300 L 337 365 L 299 356 Z" fill="url(#rocket)" opacity="0.4"/>

  <!-- Rocket body -->
  <path d="M 213 215 L 213 362 Q 213 375 228 375 L 284 375 Q 299 375 299 362 L 299 215 Z" fill="url(#rocket)"/>

  <!-- Nose cone -->
  <path d="M 213 225 Q 214 108 256 86 Q 298 108 299 225 Z" fill="url(#rocket)"/>

  <!-- Left body shadow for depth -->
  <path d="M 213 215 L 213 375 L 235 375 L 235 215 Q 229 155 240 98 Q 222 120 213 225 Z" fill="black" opacity="0.12"/>

  <!-- Right teal highlight for depth -->
  <path d="M 282 215 L 299 215 L 299 340 L 282 340 Q 292 280 287 215 Z" fill="#4CC9F0" opacity="0.15"/>

  <!-- Nozzle -->
  <rect x="237" y="358" width="38" height="18" rx="9" fill="#1a1a35"/>

  <!-- Window -->
  <circle cx="256" cy="252" r="37" fill="black" opacity="0.4"/>
  <circle cx="256" cy="252" r="30" fill="url(#win)"/>
  <circle cx="256" cy="252" r="30" fill="none" stroke="#4CC9F0" stroke-width="2.5" opacity="0.6"/>
  <!-- Window glare -->
  <circle cx="244" cy="241" r="10" fill="white" opacity="0.5"/>
  <circle cx="247" cy="244" r="5"  fill="white" opacity="0.3"/>
</svg>
