<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="40%" stop-color="#FFD23F"/>
      <stop offset="70%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="iconGradDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="iconClip">
      <circle cx="48" cy="60" r="30"/>
    </clipPath>
  </defs>

  <!-- "r" -->
  <text x="0" y="88" font-family="'Nunito', 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif"
        font-weight="900" font-size="76" fill="#1a1a2e" letter-spacing="-1">r</text>

  <!-- "o" replaced by icon circle -->
  <!-- Circle background (matches the "o" visual weight) -->
  <circle cx="64" cy="57" r="31" fill="url(#iconGradDark)"/>
  <circle cx="64" cy="57" r="31" fill="none" stroke="url(#iconGrad)" stroke-width="0"/>

  <!-- Upward trend arrow inside the circle -->
  <!-- Chart line going up-right -->
  <polyline points="40,72 50,62 60,68 76,44" fill="none" stroke="url(#iconGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#iconClip)"/>
  <!-- Arrow head -->
  <polygon points="76,44 66,44 76,34 86,44" fill="url(#iconGrad)" clip-path="url(#iconClip)"/>

  <!-- "tinup" -->
  <text x="96" y="88" font-family="'Nunito', 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif"
        font-weight="900" font-size="76" fill="#1a1a2e" letter-spacing="-1">tinup</text>
</svg>
